[project]
name = "evcc-chargeback"
version = "0.2.0"
description = "Monthly statement for the home charging cost of a company car, from evcc session data"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = ["reportlab>=4.2", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5"]

[project.scripts]
evcc-chargeback = "evcc_chargeback.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
